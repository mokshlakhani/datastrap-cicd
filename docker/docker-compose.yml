# One command starts the whole CI toolbox:   docker compose -f docker/docker-compose.yml up -d --build
# (or simply: make up)
#
#   Jenkins    -> http://localhost:8090   (runs the pipeline)
#   SonarQube  -> http://localhost:9000   (code quality reports, login admin / admin first time)
#   Your app   -> http://localhost:8080   (prod) and :8081 (staging), started BY the pipeline
name: datastrap-ci

services:
  jenkins:
    build: ./jenkins                     # our own image: Jenkins + Docker CLI + Python + Node + scanner
    image: datastrap/jenkins:2.580.2
    container_name: jenkins
    user: root                           # lab shortcut: lets Jenkins use the Docker socket (see README troubleshooting)
    restart: unless-stopped
    ports:
      - "8090:8080"                      # Jenkins web page (8080 is kept free for the deployed app)
    volumes:
      - jenkins_home:/var/jenkins_home   # persistent volume: jobs, plugins and settings survive restarts
      - /var/run/docker.sock:/var/run/docker.sock   # lets Jenkins start Docker containers on your computer
    networks: [ci]

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy       # wait until the database is ready
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Copy docker/.env.example to docker/.env first}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [ci]

  sonar-db:
    image: postgres:16.15-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Copy docker/.env.example to docker/.env first}
      POSTGRES_DB: sonarqube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks: [ci]

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:

networks:
  ci:
    name: datastrap-ci                   # fixed name: the pipeline attaches the deployed app to this network too
