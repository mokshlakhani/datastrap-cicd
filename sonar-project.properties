# Settings for the SonarQube scanner (read automatically by `sonar-scanner`).
# The server address and login token are NOT here: Jenkins injects them (withSonarQubeEnv).
sonar.projectKey=datastrap-cicd
sonar.projectName=DataStrap CI/CD

# Where our own code lives (the Jenkinsfile and scripts are not analysed).
sonar.sources=.
# Never analyse libraries, vendored code, documentation or generated files.
sonar.exclusions=OpenStrap/**,**/node_modules/**,docs/**,.venv/**,mobile/android/**,mobile/web/**,demo_data.json,**/package-lock.json,tests/**,**/*.webp
# Tests are code too, but are listed separately so they do not count as "production code".
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
# Copy-paste detection ignores tests and the third-party library.
sonar.cpd.exclusions=OpenStrap/**,tests/**,**/node_modules/**,docs/**

# Languages in this project.
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Python coverage report written by pytest-cov (see the Test stage).
sonar.python.coverage.reportPaths=coverage.xml
# Python test results written by pytest.
sonar.python.xunit.reportPath=reports/pytest.xml
